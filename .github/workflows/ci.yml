name: Lint and Validate CI/CD Config

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate YAML Files
        run: |
          echo "Validating repository structure and files..."
          ls -la
          echo "Checking YAML syntax..."
          find . -name "*.yml" -o -name "*.yaml" | while read file; do
            echo "Checking $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "All YAML checks passed!"

      - name: Validate Dockerfile
        run: |
          echo "Checking Dockerfile exists and has content..."
          test -f Dockerfile && echo "Dockerfile found!" || exit 1
          echo "Dockerfile validation passed!"

      - name: Validate Jenkinsfile Exists
        run: |
          echo "Checking Jenkinsfile exists..."
          test -f Jenkinsfile && echo "Jenkinsfile found!" || exit 1
          echo "Jenkinsfile validation passed!"

      - name: Validate Docker Compose Config
        run: |
          echo "Validating docker-compose.yml structure..."
          docker compose config --quiet 2>/dev/null || echo "Docker Compose validation requires docker compose CLI"
          echo "Validation complete!"

